<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snake Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html, body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        margin: 0;
        background-color: black;
      }
      .game-wrapper {
        position: relative;
        width: -moz-fit-content;
        width: fit-content;
      }
      #gamecanvas {
        max-width: 100vmin;
      }
      .panel {
        position: absolute;
        inset: 0;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 50px;
        margin-right: 80px;
      }
      .hidden {
        display: none !important;
      }
      button {
        background-color: transparent;
        border: solid 1px white;
        border-radius: 20px;
        padding: 5px 10px;
        color: white;
        cursor: pointer;
        outline: none;
      }
      button:hover {
        background-color: #fff;
        color: black;
      }
    </style>

    <script type="module" crossorigin src="/assets/index-CntS8EmG.js"></script>
  </head>
  <body>
    <div class="game-wrapper">
      <div class="panel" id="panel">
        <h2 id="score">Score: 0</h2>
        <button id="start-btn">Start Game</button>
      </div>
      <canvas id="gamecanvas"></canvas>
    </div>
  </div>
</body>
</html>
